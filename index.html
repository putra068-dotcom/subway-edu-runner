<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Runner - Atlas Edition</title>
    <!-- CDN Phaser 3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Titan+One&display=swap');

        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; background: #0b0f19; font-family: 'Titan One', cursive, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #game-container { 
            width: 100vw; height: 56.25vw; max-width: 960px; max-height: 540px; 
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.4), 0 0 90px rgba(0,0,0,0.9); 
            position: relative; border-radius: 18px; overflow: hidden; border: 4px solid #ffcc00;
        }

        .dom-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 10; }
        
        .menu-card { 
            pointer-events: auto; background: rgba(15, 23, 42, 0.94); border: 4px solid #ff0055; 
            padding: 25px 35px; border-radius: 24px; text-align: center; color: white; width: 85%; max-width: 480px; 
            box-shadow: 0 10px 35px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 0, 85, 0.3); backdrop-filter: blur(8px);
        }

        .logo-title { 
            font-family: 'Permanent Marker', cursive; font-size: 38px; color: #ffcc00; 
            text-shadow: 4px 4px 0px #ff0055, 7px 7px 0px #000; margin: 0 0 8px 0; transform: rotate(-2deg); letter-spacing: 2px;
        }

        .sub-title { font-size: 13px; color: #00ffff; text-shadow: 2px 2px 0 #000; margin-bottom: 18px; letter-spacing: 1px; }

        .input-name { 
            width: 100%; padding: 12px; border-radius: 12px; border: 3px solid #ffcc00; 
            background: #1e293b; color: #fff; font-family: inherit; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none;
        }

        .select-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .select-custom { 
            flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #00ffff; 
            background: #0f172a; color: #fff; font-family: inherit; font-size: 13px; text-align: center; cursor: pointer;
        }

        .btn-subway { 
            display: block; width: 100%; padding: 14px; margin: 8px 0; background: linear-gradient(180deg, #ff9900 0%, #ff5500 100%); 
            color: white; border: 3px solid #fff; border-radius: 14px; font-size: 20px; font-family: 'Titan One', cursive; 
            cursor: pointer; text-transform: uppercase; text-shadow: 2px 2px 0 #000; box-shadow: 0 6px 0 #993300, 0 10px 15px rgba(0,0,0,0.5); 
            transition: all 0.1s ease;
        }
        .btn-subway:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-subway:active { transform: translateY(4px); box-shadow: 0 2px 0 #993300; }
        .btn-blue { background: linear-gradient(180deg, #00ccff 0%, #0066ff 100%); box-shadow: 0 6px 0 #003399; }

        /* Quiz Modal Overlay */
        #quiz-container { 
            display: none; pointer-events: auto; background: #ffffff; color: #1e293b; border: 5px solid #ff0055; 
            border-radius: 24px; padding: 25px; width: 90%; max-width: 550px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; text-align: center;
        }
        #question-text { font-size: 20px; margin-bottom: 20px; line-height: 1.4; color: #0f172a; }
        .option-btn { 
            display: block; width: 100%; padding: 12px 16px; margin: 8px 0; background: #f1f5f9; border: 3px solid #cbd5e1; 
            border-radius: 12px; font-size: 16px; font-family: inherit; cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .option-btn:hover { background: #e2e8f0; border-color: #ff0055; }
        .option-btn.correct { background: #22c55e !important; color: white; border-color: #15803d; }
        .option-btn.wrong { background: #ef4444 !important; color: white; border-color: #b91c1c; }

        /* Admin Panel Modal */
        #admin-panel { 
            display: none; pointer-events: auto; background: #0f172a; color: white; padding: 25px; border-radius: 20px; 
            width: 90%; max-width: 680px; max-height: 80vh; overflow-y: auto; text-align: left; border: 3px solid #00ffff;
        }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-size: 12px; color: #94a3b8; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-family: inherit; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e293b; }
        th, td { border: 1px solid #334155; padding: 8px; font-size: 12px; text-align: left; }
        th { background: #334155; color: #00ffff; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="dom-overlay">
        <!-- Menu Utama -->
        <div id="main-menu" class="menu-card">
            <h1 class="logo-title">SUBWAY EDU-RUNNER</h1>
            <div class="sub-title">GRAFFITI EDITION • KELAS 2 SD</div>
            
            <input type="text" id="player-name" class="input-name" placeholder="Masukkan Nama Siswa..." value="Pemain 1">
            
            <div class="select-group">
                <select id="select-class" class="select-custom">
                    <option value="CLASS_2">Kelas 2 SD</option>
                    <option value="CLASS_3">Kelas 3 SD</option>
                </select>
                <select id="select-subject" class="select-custom">
                    <option value="MATEMATIKA">Matematika</option>
                    <option value="BAHASA_INDONESIA">Bahasa Indonesia</option>
                </select>
            </div>

            <button class="btn-subway" onclick="startGame()">MAIN SEKARANG</button>
            <button class="btn-subway btn-blue" onclick="openAdminPanel()">PANEL GURU / ADMIN</button>
        </div>

        <!-- Modal Kuiz -->
        <div id="quiz-container">
            <div id="question-text">Memuat Soal...</div>
            <div id="options-container"></div>
        </div>

        <!-- Panel Admin -->
        <div id="admin-panel">
            <h2 style="color: #ffcc00; margin-top: 0; border-bottom: 2px solid #334155; padding-bottom: 8px;">Panel Manajemen Soal Guru</h2>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <select id="admin-class" class="select-custom" onchange="loadQuestionsForAdmin()">
                    <option value="CLASS_2">Kelas 2 SD</option>
                    <option value="CLASS_3">Kelas 3 SD</option>
                </select>
                <select id="admin-subject" class="select-custom" onchange="loadQuestionsForAdmin()">
                    <option value="MATEMATIKA">Matematika</option>
                    <option value="BAHASA_INDONESIA">Bahasa Indonesia</option>
                </select>
            </div>

            <div style="background: #1e293b; padding: 15px; border-radius: 12px;">
                <h4 style="margin:0 0 10px 0; color:#00ffff;">Tambah Soal Baru</h4>
                <div class="form-group"><label>Pertanyaan:</label><textarea id="q-text" rows="2"></textarea></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="form-group"><label>A:</label><input type="text" id="opt-a"></div>
                    <div class="form-group"><label>B:</label><input type="text" id="opt-b"></div>
                    <div class="form-group"><label>C:</label><input type="text" id="opt-c"></div>
                    <div class="form-group"><label>D:</label><input type="text" id="opt-d"></div>
                </div>
                <div class="form-group">
                    <label>Kunci Jawaban:</label>
                    <select id="correct-ans">
                        <option value="A">Pilihan A</option>
                        <option value="B">Pilihan B</option>
                        <option value="C">Pilihan C</option>
                        <option value="D">Pilihan D</option>
                    </select>
                </div>
                <button class="btn-subway" style="font-size:14px; padding:8px; margin-top:5px;" onclick="saveQuestion()">SIMPAN SOAL</button>
            </div>

            <h4 style="margin-top:15px;">Daftar Soal Tersimpan</h4>
            <table>
                <thead><tr><th>No</th><th>Pertanyaan</th><th>Kunci</th><th>Aksi</th></tr></thead>
                <tbody id="question-table-body"></tbody>
            </table>
            <button class="btn-subway btn-blue" style="font-size:14px; padding:8px; margin-top:15px;" onclick="closeAdminPanel()">TUTUP PANEL</button>
        </div>
    </div>
</div>

<script>
    const defaultQuestions = {
        "CLASS_2": {
            "MATEMATIKA": [
                { id: 1, question: "Berapakah hasil dari 15 + 8?", options: ["21", "23", "25", "27"], answer: "B" },
                { id: 2, question: "Bangun datar yang memiliki 3 sisi adalah...", options: ["Persegi", "Segitiga", "Lingkaran", "Trapesium"], answer: "B" }
            ],
            "BAHASA_INDONESIA": [
                { id: 1, question: "Hewan peliharaan yang mengeong adalah...", options: ["Kambing", "Kucing", "Anjing", "Ayam"], answer: "B" }
            ]
        }
    };

    if (!localStorage.getItem('edu_game_questions')) {
        localStorage.setItem('edu_game_questions', JSON.stringify(defaultQuestions));
    }

    let activeQuestions = [], currentQuestionIndex = 0, gameInstance = null;
    let playerName = "Siswa", currentScore = 0, selectedClass = "CLASS_2", selectedSubject = "MATEMATIKA";

    function openAdminPanel() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadQuestionsForAdmin();
    }

    function closeAdminPanel() {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('main-menu').style.display = 'block';
    }

    function getStoredData() { return JSON.parse(localStorage.getItem('edu_game_questions')) || {}; }
    function saveStoredData(data) { localStorage.setItem('edu_game_questions', JSON.stringify(data)); }

    function loadQuestionsForAdmin() {
        const cls = document.getElementById('admin-class').value;
        const subj = document.getElementById('admin-subject').value;
        const data = getStoredData();
        const questions = (data[cls] && data[cls][subj]) ? data[cls][subj] : [];
        const tbody = document.getElementById('question-table-body');
        tbody.innerHTML = '';
        questions.forEach((q, idx) => {
            tbody.innerHTML += `<tr><td>${idx+1}</td><td>${q.question}</td><td>${q.answer}</td><td><button onclick="deleteQuestion(${idx})" style="background:#ef4444;color:#fff;border:none;border-radius:4px;cursor:pointer;">Hapus</button></td></tr>`;
        });
    }

    function saveQuestion() {
        const cls = document.getElementById('admin-class').value;
        const subj = document.getElementById('admin-subject').value;
        const qText = document.getElementById('q-text').value;
        const optA = document.getElementById('opt-a').value;
        const optB = document.getElementById('opt-b').value;
        const optC = document.getElementById('opt-c').value;
        const optD = document.getElementById('opt-d').value;
        const ans = document.getElementById('correct-ans').value;

        if (!qText || !optA || !optB || !optC || !optD) return alert('Lengkapi semua kolom!');
        const data = getStoredData();
        if (!data[cls]) data[cls] = {};
        if (!data[cls][subj]) data[cls][subj] = [];
        data[cls][subj].push({ id: Date.now(), question: qText, options: [optA, optB, optC, optD], answer: ans });
        saveStoredData(data);
        loadQuestionsForAdmin();
        document.getElementById('q-text').value = '';
        document.getElementById('opt-a').value = ''; document.getElementById('opt-b').value = '';
        document.getElementById('opt-c').value = ''; document.getElementById('opt-d').value = '';
    }

    function deleteQuestion(idx) {
        const cls = document.getElementById('admin-class').value;
        const subj = document.getElementById('admin-subject').value;
        const data = getStoredData();
        data[cls][subj].splice(idx, 1);
        saveStoredData(data);
        loadQuestionsForAdmin();
    }

    function startGame() {
        playerName = document.getElementById('player-name').value.trim() || "Siswa";
        selectedClass = document.getElementById('select-class').value;
        selectedSubject = document.getElementById('select-subject').value;
        document.getElementById('main-menu').style.display = 'none';

        if (!gameInstance) {
            gameInstance = new Phaser.Game(config);
        } else {
            gameInstance.scene.start('MainScene');
        }
    }

    function triggerQuiz() {
        if (gameInstance) gameInstance.scene.pause('MainScene');
        const data = getStoredData();
        activeQuestions = (data[selectedClass] && data[selectedClass][selectedSubject]) ? data[selectedClass][selectedSubject] : defaultQuestions['CLASS_2']['MATEMATIKA'];
        currentQuestionIndex = Phaser.Math.Between(0, activeQuestions.length - 1);
        showQuestion();
        document.getElementById('quiz-container').style.display = 'block';
    }

    function showQuestion() {
        const q = activeQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.question;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        const labels = ['A', 'B', 'C', 'D'];
        q.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<strong>${labels[i]}.</strong> ${optText}`;
            btn.onclick = () => checkAnswer(labels[i], btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        const q = activeQuestions[currentQuestionIndex];
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.style.pointerEvents = 'none');

        if (selected === q.answer) {
            btn.classList.add('correct');
            currentScore += 20;
            setTimeout(() => finishQuiz(true), 1000);
        } else {
            btn.classList.add('wrong');
            const labels = ['A', 'B', 'C', 'D'];
            allBtns.forEach((b, i) => { if (labels[i] === q.answer) b.classList.add('correct'); });
            setTimeout(() => finishQuiz(false), 1500);
        }
    }

    function finishQuiz(correct) {
        document.getElementById('quiz-container').style.display = 'none';
        const scene = gameInstance.scene.getScene('MainScene');
        if (correct) {
            scene.resumeAfterQuiz();
        } else {
            alert(`Jawaban Salah! Game Over. Skor Akhir ${playerName}: ${currentScore}`);
            location.reload();
        }
    }

    // SCENE 1: PRELOADER (Menggunakan Texture Atlas Spritesheet)
    class PreloaderScene extends Phaser.Scene {
        constructor() { super('PreloaderScene'); }

        preload() {
            let progressBar = this.add.graphics();
            let progressBox = this.add.graphics();
            progressBox.fillStyle(0x1e293b, 0.8);
            progressBox.fillRect(280, 250, 400, 40);

            let loadingText = this.add.text(480, 220, 'Memuat Texture Atlas Game...', { font: '18px Titan One', fill: '#00ffff' }).setOrigin(0.5);

            this.load.on('progress', (val) => {
                progressBar.clear();
                progressBar.fillStyle(0xff0055, 1);
                progressBar.fillRect(290, 260, 380 * val, 20);
            });

            // Pemuatan Berkas Single Texture Atlas Resmi
            this.load.atlas('gameAssets', 'assets/atlas/spritesheet.png', 'assets/atlas/spritesheet.json');
        }

        create() {
            this.scene.start('MainScene');
        }
    }

    // SCENE 2: MAIN GAMEPLAY (3 Jalur Pseudo-3D Lurus Menyatu)
    class MainScene extends Phaser.Scene {
        constructor() { super('MainScene'); }

        create() {
            isGameOver = false; 
            currentScore = 0;
            currentLaneIndex = 1;

            // Animasi Koin dari Atlas
            this.anims.create({
                key: 'coin_spin',
                frames: [
                    { key: 'gameAssets', frame: 'coin_1' },
                    { key: 'gameAssets', frame: 'coin_2' },
                    { key: 'gameAssets', frame: 'coin_3' },
                    { key: 'gameAssets', frame: 'coin_4' }
                ],
                frameRate: 8, repeat: -1
            });

            // 1. Sky & Background City (Gedung & Pohon dari Atlas)
            this.add.rectangle(0, 0, 960, 540, 0x0f172a).setOrigin(0);
            
            // Latar Bangunan dari Atlas Frame
            this.add.image(130, 140, 'gameAssets', 'building_blue').setDepth(1).setScale(1.1);
            this.add.image(480, 130, 'gameAssets', 'clock_tower').setDepth(1).setScale(1.0);
            this.add.image(830, 140, 'gameAssets', 'building_yellow').setDepth(1).setScale(1.1);
            this.add.image(60, 240, 'gameAssets', 'palm').setDepth(2).setScale(0.9);
            this.add.image(900, 250, 'gameAssets', 'bench').setDepth(2).setScale(0.8);

            // 2. Pembuatan 3 Jalur Lintasan Lurus yang Bergerak Mulus
            trackGroup = this.add.group();
            this.createCleanTrack();

            // 3. Karakter Player (Frame char_back dari Atlas)
            player = this.physics.add.sprite(lanes[currentLaneIndex], 440, 'gameAssets', 'char_back').setDepth(6);
            player.setScale(0.7);
            player.setCollideWorldBounds(true);
            player.body.setSize(55, 95);

            obstacles = this.physics.add.group();
            coins = this.physics.add.group();

            // 4. UI Top Header (Icon dari Atlas)
            this.add.image(35, 30, 'gameAssets', 'ui_coin_icon').setDepth(10).setScale(0.85);
            scoreText = this.add.text(65, 18, `${playerName} | Map: ${selectedSubject} | Skor: 0`, {
                fontSize: '18px', fill: '#ffcc00', fontStyle: 'bold',
                backgroundColor: '#0f172aaa', padding: { x: 12, y: 6 }
            }).setDepth(10);

            // Controls
            this.input.keyboard.on('keydown-LEFT', () => this.moveLane(-1));
            this.input.keyboard.on('keydown-RIGHT', () => this.moveLane(1));
            this.input.keyboard.on('keydown-UP', () => this.jumpPlayer());

            // Spawners Berkala
            this.time.addEvent({ delay: 1700, callback: this.spawnObstacle, callbackScope: this, loop: true });
            this.time.addEvent({ delay: 850, callback: this.spawnCoin, callbackScope: this, loop: true });

            this.physics.add.overlap(player, coins, this.collectCoin, null, this);
            this.physics.add.collider(player, obstacles, this.hitObstacle, null, this);
        }

        createCleanTrack() {
            // Menggambar Fondasi Aspal 3-Jalur Lurus di Canvas
            let graphics = this.add.graphics().setDepth(3);
            graphics.fillStyle(0x334155, 1);
            graphics.fillRect(200, 0, 560, 540); // Aspal utama

            // Garis Pembatas 3 Jalur (Jalur 1: 300px, Jalur 2: 480px, Jalur 3: 660px)
            graphics.lineStyle(4, 0xfac400, 0.8);
            graphics.lineBetween(390, 0, 390, 540);
            graphics.lineBetween(570, 0, 570, 540);

            // Menggulung segmen bantalan kayu di atas jalan aspal
            for (let y = -100; y <= 600; y += 80) {
                let tie = this.add.rectangle(480, y, 520, 12, 0x1e293b).setDepth(3);
                trackGroup.add(tie);
            }
        }

        moveLane(dir) {
            if (isGameOver || isJumping) return;
            currentLaneIndex = Phaser.Math.Clamp(currentLaneIndex + dir, 0, 2);
            player.x = lanes[currentLaneIndex];
        }

        jumpPlayer() {
            if (!isJumping && player.body.touching.down) {
                isJumping = true;
                player.setVelocityY(-850);
                this.time.delayedCall(750, () => { isJumping = false; });
            }
        }

        spawnObstacle() {
            if (isGameOver || !player) return;
            const lane = Phaser.Math.Between(0, 2);
            const obstacleFrames = ['train_red', 'train_yellow', 'barrier', 'crate', 'barrel', 'cone', 'sign_chevron'];
            const chosenFrame = obstacleFrames[Phaser.Math.Between(0, obstacleFrames.length - 1)];

            const obs = obstacles.create(lanes[lane], -70, 'gameAssets', chosenFrame).setDepth(5);
            obs.setVelocityY(scrollSpeed * 60);
            obs.body.immovable = true;

            if (chosenFrame.includes('train')) {
                obs.setScale(0.75);
            } else {
                obs.setScale(0.85);
            }
        }

        spawnCoin() {
            if (isGameOver || !player) return;
            const lane = Phaser.Math.Between(0, 2);
            const coin = coins.create(lanes[lane], -40, 'gameAssets', 'coin_1').setDepth(5);
            coin.play('coin_spin');
            coin.setVelocityY(scrollSpeed * 60);
            coin.setScale(0.65);
        }

        collectCoin(p, coin) {
            coin.destroy();
            currentScore += 10;
            scoreText.setText(`${playerName} | Map: ${selectedSubject} | Skor: ${currentScore}`);
        }

        hitObstacle(p, obs) {
            if (isGameOver) return;
            isGameOver = true;
            this.physics.pause();
            obs.destroy();
            triggerQuiz();
        }

        update() {
            if (!isGameOver && trackGroup) {
                // Pergerakan bantalan jalan bergulung mulus
                trackGroup.getChildren().forEach(tie => {
                    tie.y += scrollSpeed;
                    if (tie.y > 580) {
                        tie.y = -60;
                    }
                });
            }
        }

        resumeAfterQuiz() {
            isGameOver = false;
            scoreText.setText(`${playerName} | Map: ${selectedSubject} | Skor: ${currentScore}`);
            this.physics.resume();
        }
    }

    const lanes = [300, 480, 660];
    let currentLaneIndex = 1, player, obstacles, coins, scoreText, trackGroup;
    let isJumping = false, isGameOver = false, scrollSpeed = 6.5;

    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: 960,
        height: 540,
        physics: { default: 'arcade', arcade: { gravity: { y: 1600 }, debug: false } },
        scene: [PreloaderScene, MainScene]
    };
</script>

</body>
</html>
