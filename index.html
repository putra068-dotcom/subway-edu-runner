<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Runner - Atlas Edition</title>
    <!-- CDN Phaser 3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Titan+One&display=swap');

        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; background: #0b0f19; font-family: 'Titan One', cursive, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #game-container { 
            width: 100vw; height: 56.25vw; max-width: 960px; max-height: 540px; 
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.4), 0 0 90px rgba(0,0,0,0.9); 
            position: relative; border-radius: 18px; overflow: hidden; border: 4px solid #ffcc00;
        }

        .dom-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 10; }
        
        .menu-card { 
            pointer-events: auto; background: rgba(15, 23, 42, 0.94); border: 4px solid #ff0055; 
            padding: 25px 35px; border-radius: 24px; text-align: center; color: white; width: 85%; max-width: 480px; 
            box-shadow: 0 10px 35px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 0, 85, 0.3); backdrop-filter: blur(8px);
        }

        .logo-title { 
            font-family: 'Permanent Marker', cursive; font-size: 38px; color: #ffcc00; 
            text-shadow: 4px 4px 0px #ff0055, 7px 7px 0px #000; margin: 0 0 8px 0; transform: rotate(-2deg); letter-spacing: 2px;
        }

        .sub-title { font-size: 13px; color: #00ffff; text-shadow: 2px 2px 0 #000; margin-bottom: 18px; letter-spacing: 1px; }

        .input-name { 
            width: 100%; padding: 12px; border-radius: 12px; border: 3px solid #ffcc00; 
            background: #1e293b; color: #fff; font-family: inherit; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none;
        }

        .select-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .select-custom { 
            flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #00ffff; 
            background: #0f172a; color: #fff; font-family: inherit; font-size: 13px; text-align: center; cursor: pointer;
        }

        .btn-subway { 
            display: block; width: 100%; padding: 14px; margin: 8px 0; background: linear-gradient(180deg, #ff9900 0%, #ff5500 100%); 
            color: white; border: 3px solid #fff; border-radius: 14px; font-size: 20px; font-family: 'Titan One', cursive; 
            cursor: pointer; text-transform: uppercase; text-shadow: 2px 2px 0 #000; box-shadow: 0 6px 0 #993300, 0 10px 15px rgba(0,0,0,0.5); 
            transition: all 0.1s ease;
        }
        .btn-subway:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-subway:active { transform: translateY(4px); box-shadow: 0 2px 0 #993300; }
        .btn-blue { background: linear-gradient(180deg, #00ccff 0%, #0066ff 100%); box-shadow: 0 6px 0 #003399; }

        /* Quiz Modal Overlay */
        #quiz-container { 
            display: none; pointer-events: auto; background: #ffffff; color: #1e293b; border: 5px solid #ff0055; 
            border-radius: 24px; padding: 25px; width: 90%; max-width: 550px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; text-align: center;
        }
        #question-text { font-size: 20px; margin-bottom: 20px; line-height: 1.4; color: #0f172a; }
        .option-btn { 
            display: block; width: 100%; padding: 12px 16px; margin: 8px 0; background: #f1f5f9; border: 3px solid #cbd5e1; 
            border-radius: 12px; font-size: 16px; font-family: inherit; cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .option-btn:hover { background: #e2e8f0; border-color: #ff0055; }
        .option-btn.correct { background: #22c55e !important; color: white; border-color: #15803d; }
        .option-btn.wrong { background: #ef4444 !important; color: white; border-color: #b91c1c; }

        /* Admin Panel Modal */
        #admin-panel { 
            display: none; pointer-events: auto; background: #0f172a; color: white; padding: 25px; border-radius: 20px; 
            width: 90%; max-width: 680px; max-height: 80vh; overflow-y: auto; text-align: left; border: 3px solid #00ffff;
        }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-size: 12px; color: #94a3b8; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-family: inherit; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e293b; }
        th, td { border: 1px solid #334155; padding: 8px; font-size: 12px; text-align: left; }
        th { background: #334155; color: #00ffff; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="dom-overlay">
        <!-- Menu Utama -->
        <div id="main-menu" class="menu-card">
            <h1 class="logo-title">SUBWAY EDU-RUNNER</h1>
            <div class="sub-title">GRAFFITI EDITION • KELAS 2 SD</div>
            
            <input type="text" id="player-name" class="input-name" placeholder="Masukkan Nama Siswa..." value="Pemain 1">
            
            <div class="select-group">
                <select id="select-class" class="select-custom">
                    <option value="CLASS_2">Kelas 2 SD</option>
                    <option value="CLASS_3">Kelas 3 SD</option>
                </select>
                <select id="select-subject" class="select-custom">
                    <option value="MATEMATIKA">Matematika</option>
                    <option value="BAHASA_INDONESIA">Bahasa Indonesia</option>
                </select>
            </div>

            <button class="btn-subway" onclick="startGame()">MAIN SEKARANG</button>
            <button class="btn-subway btn-blue" onclick="openAdminPanel()">PANEL GURU / ADMIN</button>
        </div>

        <!-- Modal Kuiz -->
        <div id="quiz-container">
            <div id="question-text">Memuat Soal...</div>
            <div id="options-container"></div>
        </div>

        <!-- Panel Admin -->
        <div id="admin-panel">
            <h2 style="color: #ffcc00; margin-top: 0; border-bottom: 2px solid #334155; padding-bottom: 8px;">Panel Manajemen Soal Guru</h2>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <select id="admin-class" class="select-custom" onchange="loadQuestionsForAdmin()">
                    <option value="CLASS_2">Kelas 2 SD</option>
                    <option value="CLASS_3">Kelas 3 SD</option>
                </select>
                <select id="admin-subject" class="select-custom" onchange="loadQuestionsForAdmin()">
                    <option value="MATEMATIKA">Matematika</option>
                    <option value="BAHASA_INDONESIA">Bahasa Indonesia</option>
                </select>
            </div>

            <div style="background: #1e293b; padding: 15px; border-radius: 12px;">
                <h4 style="margin:0 0 10px 0; color:#00ffff;">Tambah Soal Baru</h4>
                <div class="form-group"><label>Pertanyaan:</label><textarea id="q-text" rows="2"></textarea></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="form-group"><label>A:</label><input type="text" id="opt-a"></div>
                    <div class="form-group"><label>B:</label><input type="text" id="opt-b"></div>
                    <div class="form-group"><label>C:</label><input type="text" id="opt-c"></div>
                    <div class="form-group"><label>D:</label><input type="text" id="opt-d"></div>
                </div>
                <div class="form-group">
                    <label>Kunci Jawaban:</label>
                    <select id="correct-ans">
                        <option value="A">Pilihan A</option>
                        <option value="B">Pilihan B</option>
                        <option value="C">Pilihan C</option>
                        <option value="D">Pilihan D</option>
                    </select>
                </div>
                <button class="btn-subway" style="font-size:14px; padding:8px; margin-top:5px;" onclick="saveQuestion()">SIMPAN SOAL</button>
            </div>

            <h4 style="margin-top:15px;">Daftar Soal Tersimpan</h4>
            <table>
                <thead><tr><th>No</th><th>Pertanyaan</th><th>Kunci</th><th>Aksi</th></tr></thead>
                <tbody id="question-table-body"></tbody>
            </table>
            <button class="btn-subway btn-blue" style="font-size:14px; padding:8px; margin-top:15px;" onclick="closeAdminPanel()">TUTUP PANEL</button>
        </div>
    </div>
</div>

<script>
    const defaultQuestions = {
        "CLASS_2": {
            "MATEMATIKA": [
                { id: 1, question: "Berapakah hasil dari 15 + 8?", options: ["21", "23", "25", "27"], answer: "B" },
                { id: 2, question: "Bangun datar yang memiliki 3 sisi adalah...", options: ["Persegi", "Segitiga", "Lingkaran", "Trapesium"], answer: "B" }
            ],
            "BAHASA_INDONESIA": [
                { id: 1, question: "Hewan peliharaan yang mengeong adalah...", options: ["Kambing", "Kucing", "Anjing", "Ayam"], answer: "B" }
            ]
        }
    };

    if (!localStorage.getItem('edu_game_questions')) {
        localStorage.setItem('edu_game_questions', JSON.stringify(defaultQuestions));
    }

    let activeQuestions = [], currentQuestionIndex = 0, gameInstance = null;
    let playerName = "Siswa", currentScore = 0, selectedClass = "CLASS_2", selectedSubject = "MATEMATIKA";

    function openAdminPanel() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadQuestionsForAdmin();
    }

    function closeAdminPanel() {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('main-menu').style.display = 'block';
    }

    function getStoredData() { return JSON.parse(localStorage.getItem('edu_game_questions')) || {}; }
    function saveStoredData(data) { localStorage.setItem('edu_game_questions', JSON.stringify(data)); }

    function loadQuestionsForAdmin() {
        const cls
